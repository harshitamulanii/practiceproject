<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | LipLush</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="cart-wishlist.js" defer></script>
</head>
<body>
    <div class="announcement"><marquee>SALE IS LIVE! Find your new favourite lip look.</marquee></div>
    <header>
        <h1 class="brand">LipLush</h1>
        <div class="header-icons" aria-label="LipLush services">
            <a href="notifications.html" aria-label="Notifications"><i class="fa-solid fa-bell" aria-hidden="true"></i></a>
            <a href="cart.html" aria-label="Shopping cart" aria-current="page"><i class="fa-solid fa-bag-shopping" aria-hidden="true"></i></a>
            <a href="wishlist.html" aria-label="Wishlist"><i class="fa-solid fa-heart" aria-hidden="true"></i></a>
        </div>
    </header>
    <nav aria-label="Main navigation">
        <a href="LipLush.html">Home</a>
        <a href="lipbalms.html">Lip Balm</a>
        <a href="lipoils.html">Lip Oils</a>
        <a href="lipstains.html">Lip Stains</a>
        <a href="lipgloss.html">Lip Gloss</a>
        <a href="lipsticks.html">Lipstick</a>
    </nav>
    <main class="page-shell">
        <section class="collection-page page-panel">
            <div class="page-header">
                <div>
                    <p class="eyebrow">Your Bag</p>
                    <h2>Your Cart</h2>
                </div>
                <a class="back-link" href="LipLush.html">Continue shopping</a>
            </div>
            <p id="cart-empty" class="empty-message">Your shopping cart is empty. Find something you love in our collections.
                <a href="lipsticks.html">Explore the collections</a>
            </p>
            <div id="cart-items" class="product-grid" aria-live="polite"></div>
        </section>
    </main>
    <footer><p>Love your lips with LipLush.</p></footer>
</body>
</html>
